<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0C0820"/>
      <stop offset="100%" stop-color="#160D35"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="128" height="128" rx="22" fill="url(#bg)"/>

  <!-- Feather group: centered at (64,60), tilted 18 degrees -->
  <g transform="translate(64,60) rotate(18)">

    <!-- Left vane -->
    <path d="M 0,-46 C -12,-30 -22,-14 -18,-4 C -14,8 -6,26 0,46 Z"
          fill="#DDD0A0"/>

    <!-- Right vane (lighter) -->
    <path d="M 0,-46 C 12,-30 22,-14 18,-4 C 14,8 6,26 0,46 Z"
          fill="#EDE0B8"/>

    <!-- Subtle inner highlight -->
    <path d="M 0,-46 C 5,-34 10,-20 8,-10 C 6,2 2,14 0,26 Z"
          fill="white" opacity="0.07"/>

    <!-- Spine -->
    <line x1="0" y1="-46" x2="0" y2="46"
          stroke="#BFA050" stroke-width="1.6" stroke-linecap="round"/>

    <!-- Barbs — left -->
    <line x1="-1" y1="-30" x2="-17" y2="-22" stroke="#C8B878" stroke-width="0.8" stroke-linecap="round" opacity="0.5"/>
    <line x1="-1" y1="-18" x2="-20" y2="-10" stroke="#C8B878" stroke-width="0.8" stroke-linecap="round" opacity="0.5"/>
    <line x1="-1" y1="-6"  x2="-19" y2="1"   stroke="#C8B878" stroke-width="0.8" stroke-linecap="round" opacity="0.45"/>
    <line x1="-1" y1="8"   x2="-15" y2="13"  stroke="#C8B878" stroke-width="0.8" stroke-linecap="round" opacity="0.38"/>

    <!-- Barbs — right -->
    <line x1="1" y1="-30" x2="17" y2="-22" stroke="#C8B878" stroke-width="0.8" stroke-linecap="round" opacity="0.5"/>
    <line x1="1" y1="-18" x2="20" y2="-10" stroke="#C8B878" stroke-width="0.8" stroke-linecap="round" opacity="0.5"/>
    <line x1="1" y1="-6"  x2="19" y2="1"   stroke="#C8B878" stroke-width="0.8" stroke-linecap="round" opacity="0.45"/>
    <line x1="1" y1="8"   x2="15" y2="13"  stroke="#C8B878" stroke-width="0.8" stroke-linecap="round" opacity="0.38"/>

    <!-- Purple glow halo at nib -->
    <ellipse cx="0" cy="46" rx="15" ry="15" fill="#5B21B6" opacity="0.45"/>
    <ellipse cx="0" cy="46" rx="9"  ry="9"  fill="#7C3AED" opacity="0.45"/>

    <!-- 4-pointed sparkle at nib -->
    <path d="M 0,38 L 2.2,43 L 7,45 L 2.2,47 L 0,52 L -2.2,47 L -7,45 L -2.2,43 Z"
          fill="white"/>

    <!-- Tiny dot at sparkle center -->
    <circle cx="0" cy="45" r="1.5" fill="#EDE9FE" opacity="0.85"/>
  </g>

  <!-- Background star accents -->
  <circle cx="20" cy="24" r="1.2" fill="white" opacity="0.22"/>
  <circle cx="16" cy="92" r="0.9" fill="white" opacity="0.18"/>
  <circle cx="110" cy="105" r="1.1" fill="white" opacity="0.18"/>

  <!-- Tiny cross sparkle (top-right) -->
  <line x1="104" y1="28" x2="104" y2="35" stroke="#A78BFA" stroke-width="1" stroke-linecap="round" opacity="0.55"/>
  <line x1="100" y1="31.5" x2="108" y2="31.5" stroke="#A78BFA" stroke-width="1" stroke-linecap="round" opacity="0.55"/>

  <!-- Dot near top-left -->
  <circle cx="105" cy="42" r="1" fill="#A78BFA" opacity="0.45"/>
</svg>
